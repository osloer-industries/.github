name: CodeQL SARIF security gate
description: >-
  Fail the job when CodeQL SARIF contains security-tagged findings at or above a
  configured level. Intended for artifact mode when Code Scanning upload is disabled.
inputs:
  sarif-dir:
    description: Directory containing post-processed CodeQL SARIF files
    required: false
    default: codeql-sarif
  fail-on-sarif-level:
    description: Minimum SARIF level (error, warning, or note) that fails the job
    required: false
    default: error
runs:
  using: composite
  steps:
    - name: Enforce security findings threshold
      shell: bash
      env:
        FAIL_ON_SARIF_LEVEL: ${{ inputs.fail-on-sarif-level }}
        SARIF_DIR: ${{ inputs.sarif-dir }}
      run: python3 "${GITHUB_ACTION_PATH}/../../scripts/codeql-sarif-security-gate.py"
