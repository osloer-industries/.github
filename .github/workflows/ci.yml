name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-security:
    uses: $/.github/workflows/workflow-security.yml
    permissions:
      contents: read
      actions: read

  zizmor-fail-closed-self-test:
    name: zizmor fail-closed self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout pinned zizmor-action (for action.sh)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zizmorcore/zizmor-action
          ref: 53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
          path: .ci/zizmor-action
          persist-credentials: false
      - name: Assert zizmor-action fails on must-fail fixture
        env:
          GITHUB_ACTION_PATH: ${{ github.workspace }}/.ci/zizmor-action
          GHA_ZIZMOR_INPUTS: test-fixtures/zizmor-must-fail/unpinned-uses.workflow.yml
          GHA_ZIZMOR_COLLECT: default
          GHA_ZIZMOR_ONLINE_AUDITS: "true"
          GHA_ZIZMOR_PERSONA: regular
          GHA_ZIZMOR_MIN_SEVERITY: ""
          GHA_ZIZMOR_MIN_CONFIDENCE: ""
          GHA_ZIZMOR_VERSION: ""
          GHA_ZIZMOR_TOKEN: ${{ github.token }}
          GHA_ZIZMOR_ADVANCED_SECURITY: "false"
          GHA_ZIZMOR_COLOR: "true"
          GHA_ZIZMOR_ANNOTATIONS: "true"
          GHA_ZIZMOR_FAIL_ON_NO_INPUTS: "true"
        run: |
          set -euo pipefail
          set +e
          bash "${GITHUB_ACTION_PATH}/action.sh"
          exit_code=$?
          set -e
          if [ "$exit_code" -eq 0 ]; then
            echo "::error::Expected zizmor-action to exit non-zero on must-fail fixture (advanced-security=false)"
            exit 1
          fi
          echo "zizmor-action exited with ${exit_code} on must-fail fixture as expected"
