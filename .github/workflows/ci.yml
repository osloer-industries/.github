# Aggregate required check: job ci-passed (org rulesets). workflow-security also triggers standalone on this repo.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql-inline-gate-sync:
    name: CodeQL inline gate sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Verify inline CodeQL gate matches canonical script
        run: node .github/scripts/codeql-gate-inline.ts --check

  workflow-security-reusable-contract:
    name: workflow-security reusable contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Assert workflow-security never uses caller github context for support files
        run: node --experimental-strip-types .github/scripts/assert-workflow-security-no-caller-context.ts
      - name: Verify inline zizmor threshold validator matches canonical script
        run: node .github/scripts/zizmor-thresholds-inline.ts --check
      - name: Assert reusables script checkout uses job.workflow_sha
        run: node --experimental-strip-types .github/scripts/assert-reusables-script-checkout.ts
      - name: Assert reusable workflows with direct triggers avoid caller-event mistakes
        run: node --experimental-strip-types .github/scripts/assert-reusable-workflow-triggers.ts
      - name: Assert auto-merge reusable workflow contracts
        run: node --experimental-strip-types .github/scripts/assert-auto-merge-workflow.ts
      - name: Assert ci-passed aggregate gate contracts
        run: node --experimental-strip-types .github/scripts/assert-ci-passed-workflow.ts
      - name: Assert Release Please app tokens request required permissions
        run: node --experimental-strip-types .github/scripts/assert-release-please-app-token-permissions.ts

  sonarcloud-zero-issues-unit:
    name: SonarCloud zero issues unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Run SonarCloud zero issues unit tests
        run: node --test .github/scripts/test-sonarcloud-zero-issues.test.ts

  reusable-workflow-triggers-unit:
    name: Reusable workflow trigger unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Run reusable workflow trigger contract tests
        run: node --test .github/scripts/test-assert-reusable-workflow-triggers.test.ts
      - name: Run Release Please app token permission contract tests
        run: node --test .github/scripts/test-assert-release-please-app-token-permissions.test.ts

  auto-merge-unit:
    name: Auto-merge unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Run auto-merge eligibility unit tests
        run: node --test .github/scripts/test-auto-merge-eligibility.test.ts
      - name: Run release-please version gate unit tests
        run: node --test .github/scripts/test-release-please-version-gate.test.ts
      - name: Run auto-merge workflow contract tests
        run: node --test .github/scripts/test-assert-auto-merge-workflow.test.ts
      - name: Run ci-passed gate unit tests
        run: node --test .github/scripts/test-ci-passed-gate.test.ts
      - name: Run ci-passed workflow contract tests
        run: node --test .github/scripts/test-assert-ci-passed-workflow.test.ts

  mutation-changed-unit:
    name: Mutation changed unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Run mutation changed unit tests
        run: node --test .github/scripts/test-run-mutation-changed.test.ts

  zizmor-fail-closed-self-test:
    name: zizmor fail-closed self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Resolve and verify zizmor-action pin
        id: zizmor-pin
        run: node --experimental-strip-types .github/scripts/assert-zizmor-action-pin.ts
      - name: Assert invalid zizmor threshold inputs fail closed
        run: |
          set -euo pipefail
          set +e
          ZIZMOR_MIN_SEVERITY=not-a-level ZIZMOR_MIN_CONFIDENCE='' node --experimental-strip-types .github/scripts/validate-zizmor-thresholds.ts
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "::error::Expected validate-zizmor-thresholds.ts to reject invalid min-severity"
            exit 1
          fi
          echo "validate-zizmor-thresholds rejected invalid min-severity (exit ${code})"
      - name: Assert default zizmor threshold inputs pass validation
        run: node --experimental-strip-types .github/scripts/validate-zizmor-thresholds.ts
      - name: Checkout pinned zizmor-action (for action.sh)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zizmorcore/zizmor-action
          ref: ${{ steps.zizmor-pin.outputs.zizmor-action-ref }}
          path: .ci/zizmor-action
          persist-credentials: false
      - name: Assert pinned zizmor CLI lock exists in zizmor-action
        env:
          ZIZMOR_CLI_VERSION: ${{ steps.zizmor-pin.outputs.zizmor-cli-version }}
        run: |
          set -euo pipefail
          lockfile=".ci/zizmor-action/support/locks/zizmor-${ZIZMOR_CLI_VERSION}.txt"
          if [ ! -f "$lockfile" ]; then
            echo "::error::Missing ${lockfile} — bump zizmor-action SHA or choose a version shipped in support/locks/"
            exit 1
          fi
          echo "zizmor CLI lock OK (${lockfile})"
      - name: Assert zizmor-action fails on must-fail fixture
        env:
          GITHUB_ACTION_PATH: ${{ github.workspace }}/.ci/zizmor-action
          GHA_ZIZMOR_INPUTS: test-fixtures/zizmor-must-fail/unpinned-uses.workflow.yml
          GHA_ZIZMOR_COLLECT: default
          GHA_ZIZMOR_ONLINE_AUDITS: "true"
          GHA_ZIZMOR_PERSONA: regular
          GHA_ZIZMOR_MIN_SEVERITY: ""
          GHA_ZIZMOR_MIN_CONFIDENCE: ""
          GHA_ZIZMOR_VERSION: ${{ steps.zizmor-pin.outputs.zizmor-cli-version }}
          GHA_ZIZMOR_TOKEN: ${{ github.token }}
          GHA_ZIZMOR_ADVANCED_SECURITY: "false"
          GHA_ZIZMOR_COLOR: "true"
          GHA_ZIZMOR_ANNOTATIONS: "true"
          GHA_ZIZMOR_FAIL_ON_NO_INPUTS: "true"
        run: |
          set -euo pipefail
          set +e
          bash "${GITHUB_ACTION_PATH}/action.sh"
          exit_code=$?
          set -e
          if [ "$exit_code" -eq 0 ]; then
            echo "::error::Expected zizmor-action to exit non-zero on must-fail fixture (advanced-security=false)"
            exit 1
          fi
          echo "zizmor-action exited with ${exit_code} on must-fail fixture as expected"

  ci-passed:
    name: ci-passed
    needs:
      - codeql-inline-gate-sync
      - workflow-security-reusable-contract
      - sonarcloud-zero-issues-unit
      - reusable-workflow-triggers-unit
      - auto-merge-unit
      - mutation-changed-unit
      - zizmor-fail-closed-self-test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Require every upstream job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node .github/scripts/ci-passed-gate.ts
