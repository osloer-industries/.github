name: Auto-merge low-risk PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: auto-merge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auto-merge:
    if: github.event.pull_request.draft == false
    uses: osloer-industries/.github/.github/workflows/auto-merge.yml@a081e1b87b5309ff2b3999e8d6804d8ebec5c518 # v0.1.1
    with:
      release-app-id: ${{ vars.OSLOER_RELEASE_APP_ID }}
      merge-method: merge
      allow-release-prs: true
      allow-dependabot: true
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}