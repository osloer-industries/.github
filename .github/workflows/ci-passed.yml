name: Reusable — ci-passed gate

on:
  workflow_call:
    inputs:
      needs-json:
        description: Serialized needs context from the caller ci-passed job (toJSON(needs))
        type: string
        required: true
      job-name:
        description: Display name for the aggregate status check
        type: string
        default: ci-passed
      timeout-minutes:
        description: Job timeout
        type: number
        default: 5
      sonar-zero-issues-job:
        description: >
          Caller `needs` job id for SonarCloud zero-open-issues (set job-level
          `if: github.event_name == 'pull_request'` on that job). Only this id may be skipped on
          non-pull_request events; a single job id only (no lists).
        type: string
        default: sonar-zero-open-issues
      codeql-job:
        description: Caller needs job id for CodeQL (skipped on pull_request when off-PR scanning)
        type: string
        default: codeql
      workflow-security-job:
        description: Caller needs job id for workflow security (may be skipped when workflows unchanged)
        type: string
        default: workflow-security
      ci-paths-scope-job:
        description: Caller needs job id for CI paths scope (docs-only skip contract)
        type: string
        default: ci-paths-scope

jobs:
  ci-passed:
    name: ${{ inputs.job-name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: osloer-industries/.github
          ref: ${{ job.workflow_sha }}
          path: reusables
          sparse-checkout: .github/scripts/ci-passed-gate.ts
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Require every upstream job to succeed
        env:
          NEEDS_JSON: ${{ inputs.needs-json }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SONAR_ZERO_ISSUES_JOB: ${{ inputs.sonar-zero-issues-job }}
          CODEQL_JOB: ${{ inputs.codeql-job }}
          WORKFLOW_SECURITY_JOB: ${{ inputs.workflow-security-job }}
          CI_PATHS_SCOPE_JOB: ${{ inputs.ci-paths-scope-job }}
        run: node reusables/.github/scripts/ci-passed-gate.ts