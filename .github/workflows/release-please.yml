name: Reusable — Release Please

on:
  workflow_call:
    secrets:
      RELEASE_TOKEN:
        description: Token with contents and pull-request write for release PRs (when not using a GitHub App)
        required: false
      RELEASE_APP_PRIVATE_KEY:
        description: PEM private key for the release GitHub App (paired with release-app-id input)
        required: false
    inputs:
      config-file:
        description: Release Please config path in the caller repository
        type: string
        default: release-please-config.json
      manifest-file:
        description: Release Please manifest path in the caller repository
        type: string
        default: .release-please-manifest.json
      timeout-minutes:
        description: Job timeout
        type: number
        default: 10
      release-app-id:
        description: GitHub App ID for minting a repository-scoped installation token (empty = use RELEASE_TOKEN secret)
        type: string
        default: ""
      release-app-owner:
        description: Organization or user that owns the repositories list when minting an app token
        type: string
        default: ""
      release-app-repositories:
        description: Comma-separated repository names (under release-app-owner) to scope the installation token
        type: string
        default: ""
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Prepare or publish release
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - name: Mint release GitHub App token (osloer-industries/.github)
        if: github.event_name == 'push'
        id: release-app-token-push
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.OSLOER_RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: osloer-industries
          repositories: .github
          permission-contents: write
          permission-pull-requests: write
      - name: Mint release GitHub App token (reusable caller)
        if: github.event_name == 'workflow_call' && inputs.release-app-id != ''
        id: release-app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ inputs.release-app-id }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ inputs.release-app-owner }}
          repositories: ${{ inputs.release-app-repositories }}
          permission-contents: write
          permission-pull-requests: write
      - name: Create or update release pull request (osloer-industries/.github)
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.release-app-token-push.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Create or update release pull request (GitHub App caller)
        if: github.event_name == 'workflow_call' && inputs.release-app-id != ''
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.release-app-token.outputs.token }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
      - name: Create or update release pull request (caller token)
        if: github.event_name == 'workflow_call' && inputs.release-app-id == ''
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}