# Standalone check so Dependabot workflow-file pull requests always report this job from
# default-branch workflow definitions without depending on ci.yml job matrix churn.
name: Reusable workflow trigger unit tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: reusable-workflow-triggers-unit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reusable-workflow-triggers-unit:
    name: Reusable workflow trigger unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Run reusable workflow trigger unit tests
        run: |
          set -euo pipefail
          node --test \
            .github/scripts/test-assert-reusable-workflow-triggers.test.ts \
            .github/scripts/test-assert-release-please-app-token-permissions.test.ts