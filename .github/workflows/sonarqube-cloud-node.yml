name: Reusable — SonarQube Cloud (Node/npm)

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        description: SonarQube Cloud token (optional; job skips analysis when empty)
        required: false
    inputs:
      node-version-file:
        description: Node version file in the caller repository
        type: string
        default: .nvmrc
      coverage-command:
        description: npm script that produces coverage for Sonar
        type: string
        default: npm run test:coverage
      timeout-minutes:
        description: Job timeout
        type: number
        default: 15

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: env.SONAR_TOKEN != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm
      - if: env.SONAR_TOKEN != ''
        run: npm ci --ignore-scripts
      - if: env.SONAR_TOKEN != ''
        run: ${{ inputs.coverage-command }}
      - if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - if: env.SONAR_TOKEN == ''
        run: echo "SonarQube Cloud analysis skipped because SONAR_TOKEN is not configured."
