name: Reusable — SonarQube Cloud (Node/npm)

# package-manager: bun only changes how dependencies install and how the coverage script runs. Sonar
# still reads lcov/report paths from the caller sonar-project.properties — configure coverage output
# for the chosen runner in the consumer repository.

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        description: SonarQube Cloud token (optional; job skips analysis when empty)
        required: false
    inputs:
      node-version-file:
        description: Node version file in the caller repository
        type: string
        default: .nvmrc
      package-manager:
        description: Package manager for install and coverage script (npm or bun; default npm).
        type: string
        default: npm
      bun-version-file:
        description: Optional Bun version file when package-manager is bun.
        type: string
        default: ""
      coverage-npm-script:
        description: npm script that produces coverage for Sonar (runs npm run)
        type: string
        default: test:coverage
      timeout-minutes:
        description: Job timeout
        type: number
        default: 15

jobs:
  analyze:
    name: Analyze
    outputs:
      ce-task-id: ${{ steps.sonar-report-task.outputs.ce-task-id }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      pull-requests: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: env.SONAR_TOKEN != '' && inputs.package-manager == 'npm'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm
      - if: env.SONAR_TOKEN != '' && inputs.package-manager == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ${{ inputs.bun-version-file }}
      - if: env.SONAR_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: osloer-industries/.github
          ref: ${{ job.workflow_sha }}
          path: reusables-pm
          sparse-checkout: .github/actions/package-manager/package-manager.ts
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - if: env.SONAR_TOKEN != ''
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          set -euo pipefail
          runner="node"
          if [ "$PACKAGE_MANAGER" = "bun" ]; then
            runner="bun"
          fi
          pm="reusables-pm/.github/actions/package-manager/package-manager.ts"
          "$runner" "$pm" validate
          NPM_CI_IGNORE_SCRIPTS=true "$runner" "$pm" install
      - if: env.SONAR_TOKEN != ''
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
          NPM_SCRIPT: ${{ inputs.coverage-npm-script }}
        run: |
          set -euo pipefail
          runner="node"
          if [ "$PACKAGE_MANAGER" = "bun" ]; then
            runner="bun"
          fi
          pm="reusables-pm/.github/actions/package-manager/package-manager.ts"
          "$runner" "$pm" run
      - if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - if: env.SONAR_TOKEN != ''
        id: sonar-report-task
        run: |
          set -euo pipefail
          task_file=""
          for candidate in report-task.txt .scannerwork/report-task.txt; do
            if [ -f "$candidate" ]; then
              task_file="$candidate"
              break
            fi
          done
          if [ -z "$task_file" ]; then
            echo "::error::Sonar report-task.txt not found after scan (expected report-task.txt or .scannerwork/report-task.txt)"
            exit 1
          fi
          ce_task_id=""
          while IFS= read -r line; do
            case "$line" in
              ceTaskId=*)
                ce_task_id="${line#ceTaskId=}"
                ;;
            esac
          done < "$task_file"
          if [ -z "$ce_task_id" ]; then
            echo "::error::ceTaskId missing from ${task_file}"
            exit 1
          fi
          echo "ce-task-id=$ce_task_id" >> "$GITHUB_OUTPUT"
          echo "Sonar compute-engine task id: ${ce_task_id}"
      - if: env.SONAR_TOKEN == ''
        run: echo "SonarQube Cloud analysis skipped because SONAR_TOKEN is not configured."