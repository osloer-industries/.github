name: Reusable — job workflow context smoke (CI only)

on:
  workflow_call:
    inputs:
      expected-workflow-sha:
        description: "Commit SHA the caller pinned in uses (must match JOB_WORKFLOW_SHA)."
        type: string
        required: true
      script-relative-path:
        description: Path under the reusables repo to sparse-checkout and verify exists
        type: string
        default: .github/scripts/sonarcloud-zero-issues.ts

jobs:
  verify-job-workflow-context:
    name: job.workflow_sha contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Assert JOB_WORKFLOW_SHA matches caller pin
        id: reusables-pin
        env:
          EXPECTED: ${{ inputs.expected-workflow-sha }}
        run: |
          set -euo pipefail
          if [ -z "${JOB_WORKFLOW_SHA}" ]; then
            echo "::error::JOB_WORKFLOW_SHA is empty"
            exit 1
          fi
          if [ "${JOB_WORKFLOW_SHA}" != "${EXPECTED}" ]; then
            echo "::error::JOB_WORKFLOW_SHA (${JOB_WORKFLOW_SHA}) must equal the uses pin (${EXPECTED}); github.workflow_sha is the caller workflow, not the reusable pin"
            exit 1
          fi
          if [ "${JOB_WORKFLOW_REPOSITORY}" != "osloer-industries/.github" ]; then
            echo "::error::JOB_WORKFLOW_REPOSITORY (${JOB_WORKFLOW_REPOSITORY}) must be osloer-industries/.github"
            exit 1
          fi
          echo "sha=${JOB_WORKFLOW_SHA}" >>"$GITHUB_OUTPUT"
          echo "JOB_WORKFLOW_SHA matches caller pin (${JOB_WORKFLOW_SHA})"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: osloer-industries/.github
          ref: ${{ steps.reusables-pin.outputs.sha }}
          path: reusables
          sparse-checkout: ${{ inputs.script-relative-path }}
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Assert sparse-checkout script exists at pinned SHA
        env:
          SCRIPT_PATH: ${{ inputs.script-relative-path }}
          PIN_SHA: ${{ steps.reusables-pin.outputs.sha }}
        run: |
          set -euo pipefail
          if [ ! -f "reusables/${SCRIPT_PATH}" ]; then
            echo "::error::Missing reusables/${SCRIPT_PATH} at pin ${PIN_SHA}"
            exit 1
          fi
          echo "Found reusables/${SCRIPT_PATH}"