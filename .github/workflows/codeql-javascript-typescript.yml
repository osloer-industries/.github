name: Reusable — CodeQL JavaScript and TypeScript

on:
  workflow_call:
    inputs:
      queries:
        description: CodeQL query pack
        type: string
        default: security-and-quality
      timeout-minutes:
        description: Job timeout
        type: number
        default: 15
      code-scanning-upload:
        description: >-
          Upload SARIF to GitHub Code Scanning (requires Advanced Security on private repos).
          When false, SARIF is kept as a workflow artifact and this job fails on security-tagged
          findings at or above fail-on-sarif-level instead of using the Code Scanning UI.
        type: boolean
        default: true
      fail-on-sarif-level:
        description: >-
          Minimum SARIF result level for security-tagged CodeQL rules that fails the job when
          code-scanning-upload is false. One of error, warning, or note.
        type: string
        default: error
      source-root:
        description: >-
          Optional path passed to CodeQL init as source-root (limits analysis to that directory).
          Leave empty to analyze from the repository root.
        type: string
        default: ""

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          queries: ${{ inputs.queries }}
          source-root: ${{ inputs.source-root }}
      - name: Finish CodeQL (Code Scanning upload)
        if: inputs.code-scanning-upload
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      - name: Finish CodeQL (SARIF artifact, no upload)
        if: ${{ !inputs.code-scanning-upload }}
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          upload: never
          wait-for-processing: false
          post-processed-sarif-path: codeql-sarif
      - name: Upload CodeQL SARIF artifact
        if: ${{ !inputs.code-scanning-upload }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif-${{ github.run_id }}
          path: codeql-sarif/
          if-no-files-found: error
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ !inputs.code-scanning-upload }}
        with:
          node-version: "24"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !inputs.code-scanning-upload }}
        with:
          repository: osloer-industries/.github
          ref: ${{ job.workflow_sha }}
          path: reusables
          sparse-checkout: .github/scripts/codeql-sarif-security-gate.ts
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Enforce security findings threshold
        if: ${{ !inputs.code-scanning-upload }}
        env:
          FAIL_ON_SARIF_LEVEL: ${{ inputs.fail-on-sarif-level }}
          SARIF_DIR: codeql-sarif
        run: node reusables/.github/scripts/codeql-sarif-security-gate.ts
