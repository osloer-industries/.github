name: CodeQL gate CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: codeql-gate-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sarif-gate-unit:
    name: SARIF security gate fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Verify inline gate matches canonical script
        run: node .github/scripts/codeql-gate-inline.ts --check
      - name: Run gate fixture tests
        run: node --test .github/scripts/test-codeql-sarif-security-gate.test.ts

  codeql-live-vulnerable-gate:
    name: Live CodeQL fixture (gate must fail)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          upload: never
          wait-for-processing: false
          post-processed-sarif-path: codeql-sarif
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Expect gate to fail on live security SARIF
        env:
          FAIL_ON_SARIF_LEVEL: error
          SARIF_DIR: codeql-sarif
        run: |
          if node .github/scripts/run-shipped-codeql-gate.ts; then
            echo "Expected security gate to fail on live CodeQL SARIF"
            exit 1
          fi
          echo "Gate failed as expected on vulnerable fixture"

  artifact-mode-smoke:
    name: CodeQL artifact mode smoke (reusable steps)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          queries: security-and-quality
          source-root: test-fixtures/codeql-smoke
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          upload: never
          wait-for-processing: false
          post-processed-sarif-path: codeql-sarif
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codeql-sarif-smoke-${{ github.run_id }}
          path: codeql-sarif/
          if-no-files-found: error
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Enforce security findings threshold (shipped inline gate)
        env:
          FAIL_ON_SARIF_LEVEL: error
          SARIF_DIR: codeql-sarif
        run: node .github/scripts/run-shipped-codeql-gate.ts
