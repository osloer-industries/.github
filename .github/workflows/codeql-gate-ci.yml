name: CodeQL gate CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: codeql-gate-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sarif-gate-unit:
    name: SARIF security gate fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - name: Run gate fixture tests
        run: python3 .github/scripts/test_codeql_sarif_security_gate.py

  codeql-live-vulnerable-gate:
    name: Live CodeQL fixture (gate must fail)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          queries: security-extended
          source-root: test-fixtures/codeql-vulnerable
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          upload: never
          wait-for-processing: false
          post-processed-sarif-path: codeql-sarif
      - name: Expect gate to fail on live security SARIF
        env:
          FAIL_ON_SARIF_LEVEL: error
          SARIF_DIR: codeql-sarif
        run: |
          if python3 .github/scripts/codeql-sarif-security-gate.py; then
            echo "Expected security gate to fail on live CodeQL SARIF"
            exit 1
          fi
          echo "Gate failed as expected on vulnerable fixture"

  reusable-artifact-smoke:
    name: Reusable CodeQL artifact mode smoke
    uses: ./.github/workflows/codeql-javascript-typescript.yml
    with:
      code-scanning-upload: false
      fail-on-sarif-level: error
      source-root: test-fixtures/codeql-smoke
