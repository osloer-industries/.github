name: Reusable — Stryker mutation (changed src)

on:
  workflow_call:
    inputs:
      node-version-file:
        description: Node version file in the caller repository
        type: string
        default: .nvmrc
      full-npm-script:
        description: npm script for full src/ mutation on default-branch pushes
        type: string
        default: test:mutation
      job-name:
        description: GitHub check name shown for this job
        type: string
        default: Mutation
      timeout-minutes:
        description: Job timeout
        type: number
        default: 10
      reusables-ref:
        description: Commit SHA of osloer-industries/.github that supplies run-mutation-changed.ts (empty = caller-pinned workflow SHA from github.workflow_sha)
        type: string
        default: ""

jobs:
  mutation:
    name: ${{ inputs.job-name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Resolve reusables commit for mutation helper
        if: github.event_name == 'pull_request'
        id: reusables
        env:
          INPUT_REF: ${{ inputs.reusables-ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          ref="${INPUT_REF}"
          if [ -z "$ref" ]; then
            ref="${WORKFLOW_SHA}"
          fi
          if [ -z "$ref" ]; then
            echo "::error::Could not resolve osloer-industries/.github ref. Pin uses: to a commit SHA or pass reusables-ref."
            exit 1
          fi
          echo "ref=$ref" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          repository: osloer-industries/.github
          ref: ${{ steps.reusables.outputs.ref }}
          path: reusables
          sparse-checkout: .github/scripts/run-mutation-changed.ts
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Mutation (changed src on pull request)
        if: github.event_name == 'pull_request'
        env:
          MUTATION_BASE_REF: ${{ github.event.pull_request.base.sha }}
          MUTATION_REPO_ROOT: ${{ github.workspace }}
        run: node reusables/.github/scripts/run-mutation-changed.ts
      - name: Mutation (full src on default branch)
        if: github.event_name == 'push'
        env:
          NPM_SCRIPT: ${{ inputs.full-npm-script }}
        run: npm run "$NPM_SCRIPT"