name: Reusable — workflow security

on:
  workflow_call:
    inputs:
      min-severity:
        description: |
          Minimum finding severity zizmor reports (empty = omit flag, report all — org default).
          informational, low, medium, high filter out lower severities (raising relaxes the gate).
          unknown is accepted but deprecated by zizmor; prefer empty.
        type: string
        default: ""
      min-confidence:
        description: |
          Minimum finding confidence zizmor reports (empty = omit flag, report all — org default).
          low, medium, high filter out lower confidence (raising relaxes the gate).
          unknown is accepted but deprecated by zizmor; prefer empty.
        type: string
        default: ""
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: workflow-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-security:
    name: Workflow security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Validate zizmor min severity and confidence
        env:
          ZIZMOR_MIN_SEVERITY: ${{ inputs.min-severity }}
          ZIZMOR_MIN_CONFIDENCE: ${{ inputs.min-confidence }}
        run: |
          set -euo pipefail
          VALIDATE_TS="$(mktemp --suffix=.mts)"
          trap 'rm -f "$VALIDATE_TS"' EXIT
          cat <<'ZIZMOR_THRESHOLDS_INLINE' >"$VALIDATE_TS"
          /**
           * Fail-closed validation for zizmor-action min-severity / min-confidence.
           * Allowed values match zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b action.yml.
           * Empty string means omit the flag (report all findings — strictest fail-closed default).
           */
          
          /** @see https://github.com/zizmorcore/zizmor-action action.yml inputs.min-severity */
          export const MIN_SEVERITY_ALLOWED = [
            "",
            "unknown",
            "informational",
            "low",
            "medium",
            "high",
          ] as const;
          
          /** @see https://github.com/zizmorcore/zizmor-action action.yml inputs.min-confidence */
          export const MIN_CONFIDENCE_ALLOWED = [
            "",
            "unknown",
            "low",
            "medium",
            "high",
          ] as const;
          
          function usageList(values: readonly string[]): string {
            const shown = values.filter((v) => v.length > 0);
            return `omit or empty (strictest), ${shown.join(", ")}`;
          }
          
          export function validateZizmorThresholds(
            minSeverity: string,
            minConfidence: string,
          ): void {
            if (!MIN_SEVERITY_ALLOWED.includes(minSeverity as (typeof MIN_SEVERITY_ALLOWED)[number])) {
              console.error(
                `::error::Invalid min-severity ${JSON.stringify(minSeverity)}. Allowed: ${usageList(MIN_SEVERITY_ALLOWED)}`,
              );
              process.exit(1);
            }
            if (
              !MIN_CONFIDENCE_ALLOWED.includes(
                minConfidence as (typeof MIN_CONFIDENCE_ALLOWED)[number],
              )
            ) {
              console.error(
                `::error::Invalid min-confidence ${JSON.stringify(minConfidence)}. Allowed: ${usageList(MIN_CONFIDENCE_ALLOWED)}`,
              );
              process.exit(1);
            }
            if (minSeverity === "unknown" || minConfidence === "unknown") {
              console.warn(
                "::warning::min-severity/min-confidence 'unknown' is deprecated in zizmor; prefer empty default for full reporting.",
              );
            }
          }
          
          const minSeverity = process.env.ZIZMOR_MIN_SEVERITY ?? "";
          const minConfidence = process.env.ZIZMOR_MIN_CONFIDENCE ?? "";
          
          validateZizmorThresholds(minSeverity, minConfidence);
          console.log("zizmor threshold inputs OK");
          ZIZMOR_THRESHOLDS_INLINE
          node --experimental-strip-types "$VALIDATE_TS"
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          curl -fsSL "$url" -o "$tarball"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar xzf "$tarball"
          mkdir -p "${HOME}/.local/bin"
          install -m 0755 actionlint "${HOME}/.local/bin/actionlint"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Run actionlint
        run: actionlint -color
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: "1.31.1"
          advanced-security: false
          annotations: true
          online-audits: true
          min-severity: ${{ inputs.min-severity }}
          min-confidence: ${{ inputs.min-confidence }}
