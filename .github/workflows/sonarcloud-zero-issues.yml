name: Reusable — SonarCloud zero open issues

on:
  workflow_call:
    inputs:
      project-key:
        description: SonarCloud project key (default osloer-industries_<caller repo name>)
        type: string
        default: ""
      organization:
        description: SonarCloud organization key used in the default project key
        type: string
        default: osloer-industries
      timeout-minutes:
        description: Maximum minutes to wait for SonarCloud PR analysis at the head commit
        type: number
        default: 20
      poll-interval-seconds:
        description: Seconds between SonarCloud API polls while waiting for analysis
        type: number
        default: 10
      reusables-ref:
        description: Commit SHA of osloer-industries/.github that supplies the gate script (empty = caller-pinned workflow SHA from github.workflow_sha)
        type: string
        default: ""
    secrets:
      SONAR_TOKEN:
        description: SonarCloud user token with permission to read issues for the project
        required: true

jobs:
  zero-open-issues:
    name: SonarCloud zero open issues
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - name: Resolve reusables commit for gate script
        id: reusables
        env:
          INPUT_REF: ${{ inputs.reusables-ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          ref="${INPUT_REF}"
          if [ -z "$ref" ]; then
            ref="${WORKFLOW_SHA}"
          fi
          if [ -z "$ref" ]; then
            echo "::error::Could not resolve osloer-industries/.github ref. Pin uses: to a commit SHA (sets github.workflow_sha) or pass reusables-ref."
            exit 1
          fi
          echo "ref=$ref" >>"$GITHUB_OUTPUT"
          echo "Using osloer-industries/.github@${ref} for sonarcloud-zero-issues.ts"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: osloer-industries/.github
          ref: ${{ steps.reusables.outputs.ref }}
          path: reusables
          sparse-checkout: .github/scripts/sonarcloud-zero-issues.ts
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Enforce zero open SonarCloud issues on pull request
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ inputs.project-key }}
          SONAR_ORGANIZATION: ${{ inputs.organization }}
          SONAR_WAIT_TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
          SONAR_POLL_INTERVAL_SECONDS: ${{ inputs.poll-interval-seconds }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "::error::SONAR_TOKEN secret is required for SonarCloud zero open issues. Configure a repository or organization Actions secret; the job must fail when it is missing."
            exit 1
          fi
          node reusables/.github/scripts/sonarcloud-zero-issues.ts
