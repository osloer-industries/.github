name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    uses: ./.github/workflows/release-please.yml
    secrets:
      RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}