name: Reusable — Node/npm quality

on:
  workflow_call:
    inputs:
      node-version-file:
        description: Node version file in the caller repository
        type: string
        default: .nvmrc
      package-manager:
        description: Package manager for install, audit, and run (npm or bun; default npm).
        type: string
        default: npm
      bun-version-file:
        description: Optional Bun version file when package-manager is bun.
        type: string
        default: ""
      check-npm-script:
        description: npm script for lint, typecheck, coverage, build (runs npm run)
        type: string
        default: check
      npm-ci-ignore-scripts:
        description: Pass --ignore-scripts to npm ci
        type: boolean
        default: true
      audit-level:
        description: npm audit --audit-level value
        type: string
        default: high
      npm-prefixes-json:
        description: JSON array of extra --prefix paths for npm ci and audit (monorepo helpers)
        type: string
        default: "[]"
      job-name:
        description: GitHub check name shown for this job
        type: string
        default: Quality
      timeout-minutes:
        description: Job timeout
        type: number
        default: 10
      fetch-depth:
        description: Checkout fetch-depth (0 for full history and git-based PR helpers)
        type: number
        default: 1
      pr-pre-check-script:
        description: Optional script path under the caller repo run with node on pull_request only (e.g. scripts/check-guardrail-changes.ts)
        type: string
        default: ""

jobs:
  quality:
    name: ${{ inputs.job-name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch-depth }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.package-manager == 'npm'
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: inputs.package-manager == 'bun'
        with:
          bun-version-file: ${{ inputs.bun-version-file }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: osloer-industries/.github
          ref: ${{ job.workflow_sha }}
          path: reusables-pm
          sparse-checkout: .github/actions/package-manager/package-manager.ts
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Install dependencies
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
          NPM_CI_IGNORE_SCRIPTS: ${{ inputs.npm-ci-ignore-scripts }}
          NPM_PREFIXES_JSON: ${{ inputs.npm-prefixes-json }}
        run: |
          set -euo pipefail
          runner="node"
          if [ "$PACKAGE_MANAGER" = "bun" ]; then
            runner="bun"
          fi
          pm="reusables-pm/.github/actions/package-manager/package-manager.ts"
          "$runner" "$pm" validate
          "$runner" "$pm" install
      - name: Pull request pre-check
        if: github.event_name == 'pull_request' && inputs.pr-pre-check-script != ''
        env:
          GUARDRAIL_BASE_REF: ${{ github.event.pull_request.base.sha }}
          PR_PRE_CHECK_SCRIPT: ${{ inputs.pr-pre-check-script }}
        run: node "$PR_PRE_CHECK_SCRIPT"
      - name: Audit production dependencies
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
          NPM_PREFIXES_JSON: ${{ inputs.npm-prefixes-json }}
          AUDIT_LEVEL: ${{ inputs.audit-level }}
        run: |
          set -euo pipefail
          runner="node"
          if [ "$PACKAGE_MANAGER" = "bun" ]; then
            runner="bun"
          fi
          pm="reusables-pm/.github/actions/package-manager/package-manager.ts"
          "$runner" "$pm" audit
      - name: Run check
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
          NPM_SCRIPT: ${{ inputs.check-npm-script }}
        run: |
          set -euo pipefail
          runner="node"
          if [ "$PACKAGE_MANAGER" = "bun" ]; then
            runner="bun"
          fi
          pm="reusables-pm/.github/actions/package-manager/package-manager.ts"
          "$runner" "$pm" run