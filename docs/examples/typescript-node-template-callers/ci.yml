name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: osloer-industries/.github/.github/workflows/node-npm-quality.yml@2ca73ffa33d476b7a36647cd37a6effce34f4fb0
    with:
      npm-prefixes-json: '["packages/eslint-sonarjs"]'

  setup-smoke:
    uses: osloer-industries/.github/.github/workflows/node-setup-smoke.yml@2ca73ffa33d476b7a36647cd37a6effce34f4fb0
