name: SonarQube Cloud

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    uses: osloer-industries/.github/.github/workflows/sonarqube-cloud-node.yml@2ca73ffa33d476b7a36647cd37a6effce34f4fb0
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
