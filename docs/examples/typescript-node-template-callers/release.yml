name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    uses: osloer-industries/.github/.github/workflows/release-please.yml@2ca73ffa33d476b7a36647cd37a6effce34f4fb0
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
